<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f4" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17151b" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kyle Heron — Senior Software Engineer</title>
  <!--app-head-->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kyle Heron" />
  <meta property="og:image" content="https://kyher.github.io/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://kyher.github.io/og-image.jpg" />
  <script>
    (function () {
      var root = document.documentElement;

      // Storage can be unavailable (e.g. blocked site data), which counts as nothing saved.
      function readStored(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }

      function writeStored(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (e) {
          return false;
        }
      }

      // Language links carry the visitor's choice in ?lang=, so it works however
      // the link was opened. It stays in the address if it couldn't be saved, so
      // that reloading keeps the choice.
      var params = new URLSearchParams(location.search);
      var chosen = params.get('lang');
      if (chosen !== 'en' && chosen !== 'fr') {
        chosen = null;
      }
      if (chosen && writeStored('language', chosen)) {
        params.delete('lang');
        var query = params.toString();
        history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash);
      }

      // Send visitors who prefer French from / to /fr/ before anything paints.
      var language = chosen || readStored('language') || (navigator.language || '').slice(0, 2);
      if (location.pathname === '/' && language === 'fr') {
        location.replace('/fr/' + location.search + location.hash);
      }

      var stored = readStored('theme');
      if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
