  <script>
    (function () {
      var root = document.documentElement;
      try {
        // Send visitors who prefer French from / to /fr/ before anything paints.
        var language = localStorage.getItem('language') || (navigator.language || '').slice(0, 2);
        if (location.pathname === '/' && language === 'fr') {
          location.replace('/fr/' + location.hash);
        }
        var stored = localStorage.getItem('theme');
        if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
        }
      } catch (e) {
        // Storage can be unavailable (e.g. blocked site data); use the defaults.
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
